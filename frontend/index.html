<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | MyProyectoDevOps</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eef2f7;
            color: #172033;
            font-family: system-ui, sans-serif;
        }

        main {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 16px 50px #17203312;
        }

        .marca {
            color: #3159d9;
            font-size: 14px;
            font-weight: 700;
        }

        h1 { margin: 12px 0; font-size: 30px; }
        p { color: #596579; line-height: 1.5; }
        label { display: block; margin: 22px 0 8px; }

        input, button {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font: inherit;
        }

        input { border: 1px solid #b7c1d0; }

        input:focus-visible, button:focus-visible {
            outline: 3px solid #8ba7ff;
            outline-offset: 3px;
        }

        button {
            margin-top: 26px;
            border: 0;
            background: #3159d9;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled { opacity: .65; cursor: wait; }
        #mensaje { min-height: 24px; }
        .error { color: #b42318; }
        .exito { color: #167044; }
    </style>
    <script src="/login/login.js" defer></script>
</head>
<body>
    <main>
        <span class="marca">MyProyectoDevOps</span>
        <h1>Bienvenido</h1>
        <p>Inicia sesión para acceder a tu cuenta.</p>

        <form id="login-form">
            <label for="correo">Correo electrónico</label>
            <input
                id="correo"
                name="correo"
                type="email"
                autocomplete="username"
                maxlength="150"
                required
            >

            <label for="password">Contraseña</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="ingresar" type="submit">Iniciar sesión</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
